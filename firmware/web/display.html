<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/start.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-title="Display">
<div class="box status-unknown"><div class="group">
<div class="cloud" id="cloud"></div>
<div class="admin-content-box" data-section="admin/display">
<div class="admin-grid">
  <div class="card">
    <h2>Anzeige</h2>
    <div class="form-group"><label for="dur">Dauer pro Bildschirm (Sekunden, 1 bis 60)</label>
      <input type="number" id="dur" min="1" max="60" step="1" data-path="display.screenDuration"></div>
    <div class="form-group"><label for="clk">Uhrformat</label>
      <select id="clk" data-path="display.clockFormat"><option value="24h">24 Stunden</option><option value="12h">12 Stunden (AM/PM)</option></select></div>
  </div>
  <div class="card">
    <h2>Bildschirme</h2>
    <div class="switch-list">
      <label><input type="checkbox" data-path="display.showIp"> Netzwerk (Name, IP, WLAN)</label>
      <label><input type="checkbox" data-path="display.showClock"> Uhr</label>
      <label><input type="checkbox" data-path="display.showQr"> QR-Code zur Website</label>
      <label><input type="checkbox" data-path="display.showFlower"> Blume</label>
      <label><input type="checkbox" data-path="display.showFabmobil"> Fabmobil-Logo</label>
    </div>
    <div class="hint">Ohne gültige Uhrzeit wird die Uhr übersprungen.</div>
  </div>
  <div class="card">
    <h2>Messwerte auf dem Display</h2>
    <div id="displayChannels"></div>
  </div>
</div>
</div>
<div id="footer"></div>
</div></div>
<script src="/js/ui.js"></script>
<script src="/js/api.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/config-bind.js"></script>
<script src="/js/display.js"></script>
</body>
</html>
