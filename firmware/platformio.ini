; Pflanzensensor-Firmware 3.x
;
; Envs:
;   esp8266_pcb   eigenes PCB mit NodeMCU v2 (Standard)
;   esp32_devkit  Referenzprofil ESP32
;   native        Unit-Tests für core/ und services/ ohne Hardware
;
; Das Board-Profil kommt über BOARD_PROFILE herein (boards/<name>.h). Es ist die
; einzige Stelle mit Pins, Features und Standardwerten.
;
; Eigene Geräte (nicht versioniert): boards/local/<gerät>/platformio.ini mit
; einem Env, das [esp8266] bzw. [esp32] erweitert, siehe boards/local/README.md.

[platformio]
default_envs = esp8266_pcb
src_dir = src
test_dir = test/native
extra_configs = boards/local/*/platformio.ini

[common]
build_unflags =
	-std=gnu++11
	-std=gnu++14
	-std=c++11
	-std=c++14
	-fexceptions
build_flags =
	-std=gnu++17
	-fno-exceptions
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-I boards
	-I src
; Warnungen gelten nur für den eigenen Code (build_src_flags), nicht für
; Framework und Bibliotheken. -Wshadow fehlt hier bewusst: die Header des
; ESP8266-Cores (StreamString, UdpContext, Delegate) lösen es in jeder
; Übersetzungseinheit aus, die sie einbindet. Der native Build prüft -Wshadow
; für den gesamten plattformfreien Code.
src_flags =
	-Wall
	-Wextra
	-Werror
	-Wno-unused-parameter
	-Wno-missing-field-initializers
	-Wno-error=deprecated-declarations
lib_deps_device =
	bblanchon/ArduinoJson @ ^7.4.2
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0
	adafruit/Adafruit BMP280 Library @ ^2.6.8
	bogde/HX711 @ ^0.7.5
	ricmoo/QRCode @ ^0.0.1

; Basis für ESP8266-Envs (ohne Board-Profil)
[esp8266]
platform = espressif8266 @ ^4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = boards/eagle.flash.4mmore.ld
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp8266_exception_decoder, default
build_unflags = ${common.build_unflags}
build_flags =
	${common.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D NO_GLOBAL_HTTPUPDATE
build_src_flags = ${common.src_flags}
build_src_filter = +<*> -<platform/native/>
lib_deps = ${common.lib_deps_device}
lib_ldf_mode = chain+
extra_scripts =
	pre:tools/no_fs_image.py
	pre:tools/embed_assets.py
	post:tools/gen_md5.py

[env:esp8266_pcb]
extends = esp8266
build_flags =
	${esp8266.build_flags}
	-D BOARD_PROFILE=\"pcb_v1.h\"

; Basis für ESP32-Envs (ohne Board-Profil)
[esp32]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = boards/esp32_partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
build_src_flags = ${common.src_flags}
build_src_filter = +<*> -<platform/native/>
lib_deps = ${common.lib_deps_device}
lib_ldf_mode = chain+
extra_scripts =
	pre:tools/no_fs_image.py
	pre:tools/embed_assets.py
	post:tools/gen_md5.py

[env:esp32_devkit]
extends = esp32
build_flags =
	${esp32.build_flags}
	-D BOARD_PROFILE=\"esp32_devkit.h\"

; Native Tests: nur core/, services/ und platform/native werden gebaut.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_unflags = ${common.build_unflags}
build_flags =
	-std=gnu++17
	-I boards
	-I src
	-I test/native/support
	-D BOARD_PROFILE=\"native_test.h\"
	-D NATIVE_BUILD
	-lcrypto
	-g
build_src_filter =
	-<*>
	+<core/>
	+<services/>
	+<platform/native/>
	+<web/>
	+<app/boot_guard.cpp>
	+<app/scheduler.cpp>
build_src_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wno-unused-parameter
	-Wno-missing-field-initializers
extra_scripts =
	pre:tools/embed_assets.py
	pre:tools/native_cstd.py
lib_ldf_mode = chain+
lib_compat_mode = off
; Unity explizit: test_support.h bindet unity.h ein, das LDF (chain+) findet
; es dort nicht und "pio test" bricht sonst mit "unity.h: No such file" ab.
lib_deps =
	throwtheswitch/Unity @ ^2.6.0
	bblanchon/ArduinoJson @ ^7.4.2
	ricmoo/QRCode @ ^0.0.1
