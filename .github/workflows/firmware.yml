name: Firmware

# Tests, Bau und Releases der Firmware unter firmware/ (firmware/refactor.md 5.18).

on:
  push:
    branches: ["**"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: firmware

jobs:
  native:
    name: Native Tests und Prüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - run: pip install --upgrade platformio
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio3-native-${{ hashFiles('firmware/platformio.ini') }}
      - name: Native Unit-Tests
        run: pio test -e native
      - name: Verbotene Konstrukte (String, vector, new, …)
        run: tools/check_forbidden.sh
      - name: Pinkonflikt bricht den Build
        run: tools/check_profile_conflict.sh

  js:
    name: JavaScript-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: tools/run_js_tests.sh

  build:
    name: Firmware ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp8266_pcb, esp32_devkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # intelhex: esptool (ESP32-Bootloader) braucht es, pip-PlatformIO bringt es nicht mit
      - run: pip install --upgrade platformio intelhex
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio3-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Keine Entwickler-Zugangsdaten im Checkout
        run: test ! -f boards/secrets.h
      - name: Bauen
        run: pio run -e ${{ matrix.env }}
      - name: Stapelrahmen ≤ 512 B
        if: matrix.env == 'esp8266_pcb'
        run: tools/check_stack.sh -q 512 esp8266_pcb
      - name: Größenbericht
        run: |
          pio run -e ${{ matrix.env }} -t size | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/firmware.bin.md5

  release:
    name: Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [native, js, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version bestimmen
        id: version
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.needed == 'true'
        with: { path: firmware/artifacts }
      - name: Release anlegen (je Board-Profil ein Artefakt, ohne littlefs.bin)
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          for b in esp8266_pcb esp32_devkit; do
            cp artifacts/firmware-$b/firmware.bin out/firmware-$b.bin
            md5sum out/firmware-$b.bin | cut -d' ' -f1 > out/firmware-$b.bin.md5
          done
          { git log -1 --pretty=%B; echo; echo "| Datei | MD5 |"; echo "| --- | --- |";
            for b in esp8266_pcb esp32_devkit; do echo "| firmware-$b.bin | \`$(cat out/firmware-$b.bin.md5)\` |"; done; } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA" out/*

  # ---------------------------------------------------------------------------
  # Veröffentlichung
  # ---------------------------------------------------------------------------
  # Auf main, wenn Tests und Bau durch sind und es zur Version in
  # firmware/VERSION noch keinen Tag gibt: Release v<VERSION> mit den Dateien
  # aus tools/release_assets.sh, danach den Webflasher neu bauen.
  # Builds enthalten keine Zugangsdaten (boards/secrets.h ist ausgeschlossen
  # und wird oben geprüft); neue Geräte werden per Webflasher (USB) oder über
  # ihren eigenen Zugangspunkt eingerichtet.
  release:
    name: Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [native, js, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version und Tag
        id: version
        run: |
          v=$(cat VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "Tag v$v existiert - kein Release."; echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.version.outputs.needed == 'true'
        with: { python-version: "3.12" }
      - if: steps.version.outputs.needed == 'true'
        run: pip install --upgrade platformio intelhex
      - name: Keine Entwickler-Zugangsdaten im Checkout
        if: steps.version.outputs.needed == 'true'
        run: test ! -f boards/secrets.h
      - name: Bauen
        if: steps.version.outputs.needed == 'true'
        run: |
          pio run -e esp8266_pcb -e esp32_devkit
          tools/release_assets.sh dist
      - name: Release anlegen
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            git log -1 --pretty=%B
            echo
            echo "Flashen per USB im Browser: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo
            echo "| Datei | MD5 |"
            echo "| --- | --- |"
            for f in dist/*.bin; do echo "| $(basename $f) | \`$(md5sum $f | cut -d' ' -f1)\` |"; done
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md \
            --target "$GITHUB_SHA" dist/*
      - name: Webflasher aktualisieren
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run webflasher.yml --ref main
