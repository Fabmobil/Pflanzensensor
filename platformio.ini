; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Pflanzensensor
src_dir = Pflanzensensor/src
data_dir = Pflanzensensor/data
build_dir = .pio/build

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.littlefs_format = true
board_build.ldscript = eagle.flash.4mmore.ld
upload_protocol = esptool
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-DDEBUG_ESP_PORT=Serial
	-Os
	-DNODEBUG_WEBSOCKETS
	-DSSD1306_NO_SPLASH
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections

; Warnungen gelten nur für den eigenen Quelltext (build_src_flags wirkt allein
; auf Pflanzensensor/src/). Standen sie in build_flags, bekamen Framework und
; Bibliotheken sie ebenfalls ab: ein sauberer Neubau erzeugte 1383
; -Wshadow-Warnungen, davon nur 3 aus eigenem Code - 1170 kamen allein aus
; StreamString.h des Frameworks. -Wshadow war damit als Signal wertlos,
; obwohl es genau dafür eingeschaltet wurde (verdecktes minimumDelay, P3.1).
; Ohne dieses Flag verwirft "pio test" den Filter oben und baut den
; src_dir-Anteil gar nicht erst ein - Standardverhalten ist, Testbinaries nur
; aus Bibliotheken und den Testdateien selbst zu linken.
test_build_src = true
build_src_flags =
	-Wall
	-Wextra
	-Wshadow
	-Wno-unused-parameter
	-Wno-deprecated-declarations
	-Wno-comment
monitor_filters =
	esp8266_exception_decoder
	log2file
	default
extra_scripts =
	pre:generate_md5.py
	post:error_parser.py
check_tool = cppcheck
check_flags =
	cppcheck: --enable=all --suppress=missingIncludeSystem
	pio: --silent
lib_deps =
	arduino-libraries/NTPClient @ ^3.2.1
	bblanchon/ArduinoJson @ ^7.4.2
	LittleFS
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit SSD1306 @ ^2.5.13
	links2004/WebSockets @ 2.4.1
	beegee-tokyo/DHT sensor library for ESPx @ ^1.19
	vshymanskyy/Preferences@^2.2.2
	Catch2 @ 2.13.10
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0
	adafruit/Adafruit BMP280 Library @ ^2.6.8
	bogde/HX711 @ ^0.7.5
lib_archive = yes

[env:Pflanzensensor]
platform = espressif8266@^3.2.0
board = nodemcuv2
build_flags =
	${env.build_flags}
	-D CONFIG_FILE=\"configs/config_pflanzensensor.h\"

[error_parser]
pattern_linker = (?P<file>(?:[a-zA-Z]:)?[^:]+):(?P<line>\d+)(?::(?P<col>\d+))?:\s*(?P<type>warning|error|note):\s*(?P<message>.+)
pattern_multiple_def = (?P<file>(?:[a-zA-Z]:)?[^:]+):\((?P<line>\d+)\):\s*multiple definition of\s*['"](?P<symbol>[^'"]+)['"]
pattern_undefined = (?P<file>(?:[a-zA-Z]:)?[^:]+):(?P<line>\d+):\s*undefined reference to\s*['"](?P<symbol>[^'"]+)['"]
pattern_compilation = (?P<file>(?:[a-zA-Z]:)?[^:]+):(?P<line>\d+):(?P<col>\d+):\s*(?P<type>fatal\s+error|error|warning):\s*(?P<message>.+)
colored_output = true
group_by_file = true
show_line_number = true
max_warnings = 50
verbose = false

; ---------------------------------------------------------------------------
; Native Unit-Tests
;
; Läuft auf dem Entwicklungsrechner, ohne Gerät. Getestet wird die
; hardwareunabhängige Logik - Slotvergabe und Zustandsverwaltung des
; Messzyklus. Genau dort saßen die Fehler, die zuletzt nur durch Flashen und
; Mitlesen des seriellen Logs gefunden wurden (Warmup-Endlosschleife,
; Slot-Selbstblockade).
;
; test/shim/ ersetzt Arduino.h, den Logger und ConfigMgr durch Minimalversionen
; und liefert vor allem eine steuerbare Uhr: millis() kommt aus einer
; Testvariable, dadurch laufen Zeitschranken in Mikrosekunden statt in Echtzeit.
; Der Shim steht im Includepfad VOR Pflanzensensor/src, damit er die echten
; Header verdrängt.
;
; Aufruf: pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; Die Vorgaben aus [env] gelten für das Gerät und müssen hier zurückgenommen
; werden - sonst sucht PlatformIO für den nativen Bau ein Arduino-Board und
; zieht sämtliche Sensorbibliotheken herein.
framework =
lib_deps =
extra_scripts =
board_build.ldscript =
; test_measurement_cycle treibt die ECHTE Zustandsmaschine (siehe
; test/test_measurement_cycle/FakeSensor.h) statt sie nachzubilden. Dafür
; müssen Sensor-Basisklasse und Zyklusmanager mitgebaut werden - beide sind
; hardwareunabhängig, ihre einzigen externen Abhängigkeiten (ConfigMgr,
; SensorManager, SensorPersistence, Logger) sind im Shim ersetzt.
build_src_filter =
	-<*>
	+<sensors/sensors.cpp>
	+<sensors/sensor_measurement_cycle.cpp>
	+<sensors/sensor_measurement_cycle_data_processing.cpp>
	+<sensors/sensor_measurement_cycle_error_handling.cpp>
	+<sensors/sensor_measurement_cycle_initialization.cpp>
	+<sensors/sensor_measurement_cycle_state_handlers.cpp>
build_flags =
	-std=gnu++17
	-I test/shim
	-I Pflanzensensor/src
	; Die geräteeigene configs/config_pflanzensensor.h ist nicht versioniert.
	; Tests laufen deshalb gegen die mitgelieferte Beispielkonfiguration.
	-D CONFIG_FILE=\"configs/config_example.h\"
	-DNATIVE_TEST
build_src_flags =
	-Wall
	-Wextra
