# Reihenfolge zählt: Hooks, die Dateien anfassen (clang-format, Versions-
# anhebung), laufen vor "Require Clean Working Tree" - sonst meldet der
# saubere Arbeitsbaum genau die Änderung, die eben erst entstanden ist.
#
# Die Tests sind über files:-Muster eingegrenzt: Ein Commit, der nur
# JavaScript anfasst, soll nicht den nativen C++-Testlauf mitschleppen (und
# umgekehrt).
repos:
-   repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
    -   id: clang-format
        args: [-i]  # -i means in-place modification
        types_or: [c++, c, cuda]

-   repo: local
    hooks:
    # --- Version -----------------------------------------------------------
    -   id: bump-version
        name: Patch-Version anheben (bei Firmware- und Weboberflächen-Änderungen)
        entry: python3 firmware/tools/bump_version.py
        language: system
        pass_filenames: false
        files: ^firmware/((src|boards)/.*\.(cpp|h|hpp|c)|web/.*)$
        stages: [pre-commit]

    # --- Tests -------------------------------------------------------------
    -   id: native-tests
        name: Native Unit-Tests (pio test -e native)
        entry: bash -c 'cd firmware && pio test -e native'
        language: system
        pass_filenames: false
        files: ^firmware/(src|boards|test/native|test/vectors|platformio\.ini)
        stages: [pre-commit]

    -   id: js-tests
        name: JavaScript-Tests
        entry: firmware/tools/run_js_tests.sh
        language: system
        pass_filenames: false
        files: ^firmware/(web/js|test/js|test/vectors)/
        stages: [pre-commit]

    # --- Zuletzt: nichts Unvorgemerktes zurückgelassen --------------------
    -   id: require-clean-working-tree
        name: Require Clean Working Tree
        entry: git diff --exit-code
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
